<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1c0a05"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FF4D1A" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D1A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF4D1A" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="type">
      <rect class="reveal" x="150" y="170" height="40" width="0"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .title   { font-size: 68px; font-weight: 700; letter-spacing: 10px; fill: #FFFFFF; }
    .gl-a    { font-size: 68px; font-weight: 700; letter-spacing: 10px; fill: #FF4D1A; animation: glA 3.2s infinite steps(1); }
    .gl-b    { font-size: 68px; font-weight: 700; letter-spacing: 10px; fill: #00E5FF; opacity: .6; animation: glB 3.2s infinite steps(1); }
    .sub     { font-size: 20px; fill: #FF4D1A; letter-spacing: 3px; }
    .small   { font-size: 13px; fill: #8B949E; letter-spacing: 2px; }
    .online  { font-size: 13px; fill: #3FB950; letter-spacing: 2px; }
    .dot     { fill: #3FB950; animation: blink 1.2s infinite; }
    .scan    { animation: scan 3.5s linear infinite; }
    .reveal  { animation: reveal 4s steps(32) infinite; }
    .corner  { fill: none; stroke: #FF4D1A; stroke-width: 3; animation: pulse 2s ease-in-out infinite; }
    .flicker { animation: flicker 5s infinite; }

    @keyframes scan   { 0% { transform: translateY(-60px); } 100% { transform: translateY(280px); } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
    @keyframes reveal { 0% { width: 0; } 55%, 90% { width: 600px; } 100% { width: 0; } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes glA {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
      90% { transform: translate(-5px, 2px); opacity: .9; }
      94% { transform: translate(4px, -2px); opacity: .9; }
      97% { transform: translate(-2px, 0); opacity: .9; }
    }
    @keyframes glB {
      0%, 89%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(5px, -2px); opacity: .6; }
      95% { transform: translate(-4px, 2px); opacity: .6; }
      98% { transform: translate(2px, 0); opacity: .6; }
    }
    @keyframes flicker { 0%, 92%, 96%, 100% { opacity: 1; } 94%, 98% { opacity: .55; } }
  </style>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>

  <!-- scanning line -->
  <rect class="scan" x="0" y="0" width="900" height="60" fill="url(#scan)"/>

  <!-- corner brackets -->
  <path class="corner" d="M20 50 V20 H50"/>
  <path class="corner" d="M850 20 H880 V50"/>
  <path class="corner" d="M20 210 V240 H50"/>
  <path class="corner" d="M850 240 H880 V210"/>

  <!-- top bar -->
  <text class="small" x="40" y="46">SCP FOUNDATION  //  SITE-02  //  PERSONNEL FILE</text>
  <circle class="dot" cx="760" cy="41" r="5"/>
  <text class="online" x="774" y="46">ONLINE</text>

  <!-- title with glitch -->
  <g class="flicker">
    <text class="gl-b" x="450" y="132" text-anchor="middle">REDOVSKY</text>
    <text class="gl-a" x="450" y="132" text-anchor="middle">REDOVSKY</text>
    <text class="title" x="450" y="132" text-anchor="middle">REDOVSKY</text>
  </g>

  <!-- typing subtitle -->
  <g clip-path="url(#type)">
    <text class="sub" x="450" y="196" text-anchor="middle">SCP:SL PLUGIN DEVELOPER &#x2022; EXILED</text>
  </g>

  <text class="small" x="450" y="240" text-anchor="middle">CLEARANCE LEVEL 4  //  ACCESS GRANTED</text>
</svg>
